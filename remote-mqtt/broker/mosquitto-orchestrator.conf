# Standalone mosquitto config for the mqtt-component / mender-mqtt-agent example. This is a
# stock mosquitto broker -- it is not part of mender-orchestrator or mender-update, has no
# knowledge of either, and runs as mosquitto's own systemd service.
#
# Install as: /etc/mosquitto/conf.d/mender-orchestrator.conf
# (requires the distro's default /etc/mosquitto/mosquitto.conf to `include_dir conf.d`,
# which is the default on Debian/Yocto mosquitto packages)
#
# Plaintext, no authentication, one listener reachable from the local network. This is
# appropriate for an example/demo on a trusted LAN, and deliberately avoids the certificate
# management this example doesn't need. Anyone who can reach this port can publish/subscribe
# to any Component's topics -- do not expose this beyond a trusted network.

# persistence is expected to already be enabled in the distro's base mosquitto.conf; this
# file only adds the listener below.

listener 1883 0.0.0.0
allow_anonymous true
